site_name: Sagittarius Engine
site_description: Lightweight Modular Python Application Engine
site_author: Sagittarius Contributors
docs_dir: docs
site_dir: site
use_directory_urls: true

repo_name: Sagittarius Engine
repo_url: ""
edit_uri: ""

theme:
  name: material
  logo: assets/logo.svg
  favicon: assets/favicon.png
  features:
    - navigation.tabs
    - navigation.sections
    - navigation.top
    - toc.follow
    - content.code.copy
  palette:
    # Palette toggle for light mode
    - media: "(prefers-color-scheme: light)"
      scheme: default
      toggle:
        icon: material/brightness-7
        name: Switch to dark mode
    # Palette toggle for dark mode
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      toggle:
        icon: material/brightness-4
        name: Switch to light mode

plugins:
  - search
  - mkdocstrings:
      handlers:
        python:
          paths: [.]
          options:
            docstring_style: google
            show_root_heading: true
            show_source: false
            heading_level: 2
  # - tags:
  #     # To be enabled in later content phases
  # - social:
  #     cards: true # Uncomment when pillow/cairosvg dependencies are installed

extra:
  version:
    provider: mike

markdown_extensions:
  - admonition
  - footnotes
  - def_list
  - tables
  - pymdownx.details
  - pymdownx.tabbed
  - pymdownx.tasklist:
      custom_checkbox: true
  - pymdownx.emoji:
      emoji_index: !!python/name:pymdownx.emoji.twemoji
      emoji_generator: !!python/name:pymdownx.emoji.to_svg
  - pymdownx.superfences:
      custom_fences:
        - name: mermaid
          class: mermaid
          format: !!python/name:pymdownx.superfences.fence_code_format

nav:
  - Home: index.md
  - Getting Started:
      - Installation: getting-started/installation.md
      - First App: getting-started/first_app.md
      - First Extension: getting-started/first_extension.md
      - Project Templates: getting-started/project_templates.md
  - Concepts:
      - Overview: concepts/README.md
      - Engine: concepts/engine.md
      - Runtime: concepts/runtime.md
      - Dispatcher: concepts/dispatcher.md
      - Dependency Injection: concepts/dependency_injection.md
      - Event Bus: concepts/event_bus.md
      - Middleware: concepts/middleware.md
      - Extensions: concepts/extensions.md
      - Lifecycle: concepts/lifecycle.md
  - Runtime:
      - Application Lifecycle: runtime/application_lifecycle.md
      - Hosted Services: runtime/hosted_services.md
      - Scheduler: runtime/scheduler.md
      - Task Manager: runtime/task_manager.md
      - Async Runtime: runtime/async_runtime.md
      - Cancellation Token: runtime/cancellation_token.md
  - Advanced:
      - Extension Dependencies: advanced/extension_dependencies.md
      - Architecture: advanced/architecture.md
      - Performance: advanced/performance.md
      - Best Practices: advanced/best_practices.md
      - Troubleshooting: advanced/troubleshooting.md
  - Tutorials:
      - Desktop Application: tutorials/desktop_app.md
      - Worker Service: tutorials/worker_service.md
      - Trading Bot: tutorials/trading_bot.md
      - WebSocket Client: tutorials/websocket_client.md
      - Plugin System: tutorials/plugin_system.md
  - API Reference:
      - Overview: api/index.md
      - App: api/app.md
      - Engine Context: api/engine_context.md
      - Dispatcher: api/dispatcher.md
      - Event Bus: api/event_bus.md
      - Scheduler: api/scheduler.md
      - Task Manager: api/task_manager.md
      - Hosted Service: api/hosted_service.md
      - Extension: api/extension.md
      - Cancellation Token: api/cancellation_token.md
